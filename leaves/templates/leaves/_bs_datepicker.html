{# Bikram Sambat (BS) / Nepali Calendar Datepicker Component #}
<style>
.bs-datepicker-popover {
  position: absolute;
  z-index: 10000;
  background: var(--color-sidebar, #ffffff);
  color: var(--color-text, #101522);
  border: 1.5px solid var(--color-border, #e2e8f0);
  border-radius: var(--radius-sm, 10px);
  box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.25), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  padding: 14px;
  width: 300px;
  font-family: inherit;
  display: none;
  backdrop-filter: blur(16px);
}
.bs-dp-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  margin-bottom: 12px;
}
.bs-dp-header select {
  padding: 5px 8px;
  font-size: 0.82rem;
  font-weight: 600;
  border-radius: 6px;
  border: 1px solid var(--color-border, #cbd5e1);
  background: var(--input-bg, #f8fafc);
  color: var(--color-text, #101522);
  font-family: inherit;
  cursor: pointer;
}
.bs-dp-header select:focus {
  outline: none;
  border-color: var(--color-primary);
}
.bs-dp-nav-btn {
  border: 1px solid var(--color-border, #cbd5e1);
  background: var(--overlay-4, #f1f5f9);
  color: var(--color-text, #334155);
  border-radius: 6px;
  width: 28px;
  height: 28px;
  cursor: pointer;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  line-height: 1;
  transition: var(--transition, all 0.15s ease);
}
.bs-dp-nav-btn:hover {
  background: var(--color-primary-dark, #e0f2fe);
  color: var(--color-primary, #0369a1);
  border-color: var(--color-primary);
}
.bs-dp-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--color-text-muted, #64748b);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.bs-dp-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}
.bs-dp-day {
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.82rem;
  font-weight: 500;
  border-radius: 6px;
  cursor: pointer;
  color: var(--color-text, #1e293b);
  background: transparent;
  transition: all 0.15s ease;
  user-select: none;
}
.bs-dp-day:hover {
  background: var(--overlay-5, #f1f5f9);
  color: var(--color-primary, #0284c7);
  font-weight: 700;
}
.bs-dp-day.selected {
  background: linear-gradient(135deg, var(--color-accent, #0066cc), var(--color-primary, #0284c7)) !important;
  color: #ffffff !important;
  font-weight: 800;
  box-shadow: 0 2px 8px rgba(0, 145, 179, 0.3);
}
.bs-dp-day.today {
  border: 1.5px solid var(--color-primary, #0ea5e9);
  font-weight: 700;
  color: var(--color-primary);
}
.bs-dp-day.empty {
  cursor: default;
  pointer-events: none;
}
.bs-dp-footer {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid var(--color-border, #f1f5f9);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.bs-dp-today-btn {
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--color-primary, #0284c7);
  background: none;
  border: none;
  cursor: pointer;
  padding: 3px 6px;
  border-radius: 4px;
  font-family: inherit;
  transition: var(--transition, all 0.15s ease);
}
.bs-dp-today-btn:hover {
  background: var(--overlay-4, #f0f9ff);
}
.bs-dp-clear-btn {
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--color-danger, #ef4444);
  background: none;
  border: none;
  cursor: pointer;
  padding: 3px 6px;
  border-radius: 4px;
  font-family: inherit;
  transition: var(--transition, all 0.15s ease);
}
.bs-dp-clear-btn:hover {
  background: var(--color-rejected-bg, #fef2f2);
}
</style>

<!-- Popover Container -->
<div id="bsDatepickerPopover" class="bs-datepicker-popover">
  <div class="bs-dp-header">

  function adToBSObj(year, month, day) {
    var baseUtc = Date.UTC(1943, 3, 14);
    var targetUtc = Date.UTC(year, month - 1, day);
    var diff = Math.round((targetUtc - baseUtc) / (1000 * 60 * 60 * 24));
    var y = 2000, m = 1, d = 1;
    if (diff > 0) {
      for (var i = 0; i < diff; i++) {
        var months = bsData[y];
        if (!months) return null;
        d++;
        if (d > months[m-1]) { d = 1; m++; if (m > 12) { m = 1; y++; } }
      }
    } else if (diff < 0) {
      for (var i = 0; i < -diff; i++) {
        d--;
        if (d < 1) { m--; if (m < 1) { m = 12; y--; } var months = bsData[y]; if (!months) return null; d = months[m-1]; }
      }
    }
    if (y < 1975 || y > 2099) return null;
    return { year: y, month: m, day: d };
  }

  function bsToADObj(bsYear, bsMonth, bsDay) {
    if (bsYear < 1975 || bsYear > 2099) return null;
    var totalDays = 0;
    for (var y = 1975; y < bsYear; y++) {
      var mList = bsData[y.toString()];
      if (!mList) return null;
      for (var m = 0; m < 12; m++) totalDays += mList[m];

    var currentYearMonths = bsData[bsYear.toString()];
    if (!currentYearMonths) return null;
    for (var m = 0; m < bsMonth - 1; m++) {

    totalDays += (bsDay - 1);
    var baseUtc = Date.UTC(1918, 3, 13);
    var targetUtc = baseUtc + totalDays * 86400000;
    var d = new Date(targetUtc);
    return {
      year: d.getUTCFullYear(),
      month: d.getUTCMonth() + 1,
      day: d.getUTCDate()
    };
  }

    if (!bsObj) {
      var now = new Date();
      bsObj = adToBSObj(now.getFullYear(), now.getMonth() + 1, now.getDate());
    }

    if (bsObj) {
      currentBsYear = bsObj.year;
      currentBsMonth = bsObj.month;
    }
    mSelect.value = currentBsMonth;
    ySelect.value = currentBsYear;

    renderGrid();
    popover.style.display = 'block';
  }

  function hidePopover() {
    if (popover) popover.style.display = 'none';
  }

  if (mSelect) {
    mSelect.addEventListener('change', function() {
      currentBsMonth = parseInt(this.value, 10);
      renderGrid();
    });
    ySelect.addEventListener('change', function() {
      currentBsYear = parseInt(this.value, 10);
      renderGrid();
    });
    prevBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      currentBsMonth--;
      if (currentBsMonth < 1) { currentBsMonth = 12; currentBsYear--; }
      if (currentBsYear < 1975) currentBsYear = 1975;
      mSelect.value = currentBsMonth;
      ySelect.value = currentBsYear;
      renderGrid();
    });
    nextBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      currentBsMonth++;
      if (currentBsMonth > 12) { currentBsMonth = 1; currentBsYear++; }
      if (currentBsYear > 2099) currentBsYear = 2099;
      mSelect.value = currentBsMonth;
      ySelect.value = currentBsYear;
      renderGrid();
    });
    todayBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var now = new Date();
      var tBs = adToBSObj(now.getFullYear(), now.getMonth() + 1, now.getDate());
      if (tBs) {
        selectBsDate(tBs.year, tBs.month, tBs.day);
      }
    });
    clearBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      clearSelectedDate();
    });
  }

  document.addEventListener('click', function(e) {
    if (popover && !popover.contains(e.target) && !e.target.dataset.bsVisibleInput) {
      hidePopover();
    }
  });

  window.addEventListener('resize', hidePopover);

  function attachBsPreviewAndPicker() {
    document.querySelectorAll('input[type="datetime-local"], input[type="date"]').forEach(function(input) {
      if (input.dataset.bsPreviewAttached) return;
      if (input.classList.contains('no-bs-picker') || input.disabled) return;
      input.dataset.bsPreviewAttached = 'true';

      var isDatetime = input.type === 'datetime-local';
      var originalName = input.name;

      // 1. Create a hidden input for exact AD value form submission
      var hiddenInput = document.createElement('input');
      hiddenInput.type = 'hidden';
      hiddenInput.name = originalName;
      hiddenInput.value = input.value || '';
      hiddenInput.id = (input.id ? input.id + '-hidden' : '');
      input.parentNode.insertBefore(hiddenInput, input);

      // 2. Convert visible input to text with readonly to disable native browser calendar popups
      input.removeAttribute('name');
      input.type = 'text';
      input.readOnly = true;
      input.style.cursor = 'pointer';
      input.placeholder = input.placeholder || 'YYYY-MM-DD';
      input.dataset.bsVisibleInput = 'true';
      input.dataset.isDatetime = isDatetime ? 'true' : 'false';

      function updateDisplay() {
        var val = hiddenInput.value;
        if (!val) {
          input.value = '';
          return;
        }
        var parts = val.split('T');
        input.value = parts[0];
      }

      input.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        showPopover(hiddenInput, input);
      });

      input.addEventListener('updateDisplay', updateDisplay);
      hiddenInput.addEventListener('change', updateDisplay);
      hiddenInput.addEventListener('input', updateDisplay);

      updateDisplay();
    });
  }

  // Expose global init function for dynamically injected forms/modals
  window.initBsDatepickers = attachBsPreviewAndPicker;

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attachBsPreviewAndPicker);
  } else {
    attachBsPreviewAndPicker();
  }
})();
</script>
