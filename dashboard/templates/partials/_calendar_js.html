<script>
const CAL_API = "{% url 'calendar_data' %}";

/* In-memory cache: params string -> data object */
const _calCache = new Map();
/* In-flight fetches so we never double-fetch the same month */
const _calInFlight = new Map();

async function _fetchCalendar(params) {
  const key = params || "__current__";

  /* Serve from cache instantly */
  if (_calCache.has(key)) return _calCache.get(key);

  /* Reuse an already in-flight request for the same key */
  if (_calInFlight.has(key)) return _calInFlight.get(key);

  const url = params ? `${CAL_API}?${params}` : CAL_API;
  const promise = fetch(url)
    .then(r => r.json())
    .then(data => {
      _calCache.set(key, data);
      _calInFlight.delete(key);
      return data;
    })
    .catch(() => { _calInFlight.delete(key); return null; });

  _calInFlight.set(key, promise);
  return promise;
}

/* Silently warm the cache for adjacent months */
function _prefetch(data) {
  if (data.prev_params) _fetchCalendar(data.prev_params).catch(() => {});
  if (data.next_params) _fetchCalendar(data.next_params).catch(() => {});
}

function _renderCalendar(data) {
  if (!data) return;

  document.getElementById("cal-month-title").textContent = data.bs_month_label;
  document.getElementById("cal-month-sub").textContent   = data.ad_month_label;

  const prev = document.getElementById("cal-prev");
  const next = document.getElementById("cal-next");

  if (data.prev_params) {
    prev.classList.remove("disabled");
    prev.dataset.params = data.prev_params;
  } else {
    prev.classList.add("disabled");
    prev.dataset.params = "";
  }
  if (data.next_params) {
    next.classList.remove("disabled");
    next.dataset.params = data.next_params;
  } else {
    next.classList.add("disabled");
    next.dataset.params = "";
  }

  const backDiv = document.getElementById("cal-back-link");
  backDiv.innerHTML = !data.is_current_month
    ? `<a href="#" onclick="loadCalendar('');return false;" style="font-size:0.75rem;color:var(--color-primary);text-decoration:none;">&#x21A9; Back to current month</a>`
    : "";

  const grid    = document.getElementById("cal-grid");
  const headers = Array.from(grid.querySelectorAll(".cal-day-name"));
  grid.innerHTML = "";
  headers.forEach(h => grid.appendChild(h));

  data.weeks.forEach(week => {
    week.forEach(day => {
      const cell = document.createElement("div");
      if (day.day_number) {
        cell.className = `cal-day ${day.classes}`;
        if (day.title) cell.title = day.title;
        cell.innerHTML = `
          <span class="cal-bs-day">${day.bs_day}</span>
          <span class="cal-ad-day">${day.day_number}</span>
          ${day.leave_count ? `<span style="display:block;font-size:0.6rem;font-weight:700;line-height:1;opacity:0.85;">${day.leave_count} away</span>` : ""}
        `;
      } else {
        cell.className = "cal-day other";
      }
      grid.appendChild(cell);
    });
  });
}

async function loadCalendar(params) {
  const data = await _fetchCalendar(params);
  _renderCalendar(data);
  /* After rendering, prefetch neighbours in the background */
  if (data) _prefetch(data);
}

document.addEventListener("DOMContentLoaded", () => {
  const prev = document.getElementById("cal-prev");
  const next = document.getElementById("cal-next");

  prev.dataset.params = "{{ prev_params }}";
  next.dataset.params = "{{ next_params }}";

  prev.addEventListener("click", function(e) {
    e.preventDefault();
    if (!this.classList.contains("disabled") && this.dataset.params)
      loadCalendar(this.dataset.params);
  });

  next.addEventListener("click", function(e) {
    e.preventDefault();
    if (!this.classList.contains("disabled") && this.dataset.params)
      loadCalendar(this.dataset.params);
  });

  /* Kick off background prefetch of prev + next from the initial page load */
  const initPrev = "{{ prev_params }}";
  const initNext = "{{ next_params }}";
  if (initPrev) _fetchCalendar(initPrev).catch(() => {});
  if (initNext) _fetchCalendar(initNext).catch(() => {});
});
</script>
