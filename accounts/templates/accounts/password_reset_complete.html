{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Complete — Global Link Technology Pvt. Ltd.</title>
  <link rel="icon" type="image/webp" href="https://globallinknepal.com/static/images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary:      #00e5ff;
      --primary-dark: #0088ff;
      --bg:           #07090e;
      --surface:      rgba(16, 24, 45, 0.65);
      --border:       rgba(255, 255, 255, 0.08);
      --text:         #f8fafc;
      --text-muted:   #94a3b8;
      --radius:       16px;
      --font:         'Plus Jakarta Sans', system-ui, sans-serif;
    }
    body {
      font-family: var(--font);
      min-height: 100vh;
      background: var(--bg);
      display: grid;
      place-items: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      color: var(--text);
    }
    .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.35; pointer-events: none; }
    .orb-1 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(0, 229, 255, 0.2) 0%, transparent 70%); top: -100px; left: -80px; }
    .orb-2 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(185, 102, 255, 0.15) 0%, transparent 70%); bottom: -80px; right: -60px; }
    .card-box {
      position: relative;
      background: var(--surface);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.75rem 2.5rem 2.25rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      text-align: center;
    }
    .icon-wrap {
      width: 56px;
      height: 56px;
      background: rgba(0, 230, 118, 0.12);
      border: 1.5px solid rgba(0, 230, 118, 0.3);
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 1.25rem;
      color: #00e676;
    }
    .title { font-size: 1.15rem; font-weight: 800; color: #fff; margin-bottom: 0.75rem; }
    .desc { font-size: 0.88rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 1.75rem; }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.78rem;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #07090e;
      border: none;
      border-radius: 10px;
      font-family: var(--font);
      font-size: 0.93rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="card-box">
    <div class="icon-wrap">
      <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
    </div>

    <h1 class="title">Password Reset Successful</h1>
    <p class="desc">
      Your password has been changed successfully. You can now sign in to your account with your new password.
    </p>

    <a href="{% url 'login' %}" class="btn">Sign In Now</a>
  </div>
</body>
</html>
